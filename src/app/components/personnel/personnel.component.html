<div class="container">
  <form [formGroup]="militaryForm">
    <mat-tab-group mat-stretch-tabs="false" mat-align-tabs="start">
      <mat-tab [label]="'TABS.PERSONAL_DATA' | translate">
        <app-personal-data *ngIf="militaryForm.get('personalData') as personalDataGroup"
          [formGroup]="$any(personalDataGroup)" [maritalStatuses]="maritalStatuses">
        </app-personal-data>

      </mat-tab>
      <mat-tab [label]="'TABS.MILITARY_HIERARCHY' | translate">
        <app-military-identity *ngIf="militaryForm.get('militaryIdentity') as militaryIdentityGroup"
          [formGroup]="$any(militaryIdentityGroup)">
        </app-military-identity>
      </mat-tab>
      <mat-tab [label]="'TABS.FAMILY' | translate">
        <app-family *ngIf="militaryForm.get('family') as familyGroup" [formGroup]="$any(familyGroup)" [states]="states">
        </app-family>

      </mat-tab>
    </mat-tab-group>
  </form>
</div>
