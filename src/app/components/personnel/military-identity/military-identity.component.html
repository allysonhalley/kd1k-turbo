<!-- Military Identity -->
<div class="form-section" [formGroup]="formGroup">
  <h2>{{ 'PERSONNEL.MILITARY_IDENTITY.TITLE' | translate }}</h2>
  <div class="form-row">
    <div class="form-group">
      <label for="number">{{ 'PERSONNEL.MILITARY_IDENTITY.NUMBER' | translate }}</label>
      <input type="text" id="number" formControlName="number">
    </div>
    <div class="form-group">
      <label for="issuingAuthority">{{ 'PERSONNEL.MILITARY_IDENTITY.ISSUING_AUTHORITY' | translate }}</label>
      <input type="text" id="issuingAuthority" formControlName="issuingAuthority">
    </div>
    <div class="form-group">
      <label for="state">{{ 'PERSONNEL.MILITARY_IDENTITY.STATE' | translate }}</label>
      <select id="state" formControlName="state">
        <option value="">{{ 'COMMON.SELECT' | translate }}</option>
        <ng-container *ngFor="let state of states">
          <option [value]="state">{{ state }}</option>
        </ng-container>
      </select>
    </div>
  </div>
  <div class="form-row">
    <div class="form-group">
      <label for="issueDate">{{ 'PERSONNEL.MILITARY_IDENTITY.ISSUE_DATE' | translate }}</label>
      <input type="date" id="issueDate" formControlName="issueDate">
    </div>
    <div class="form-group">
      <label for="expirationDate">{{ 'PERSONNEL.MILITARY_IDENTITY.EXPIRATION_DATE' | translate }}</label>
      <input type="date" id="expirationDate" formControlName="expirationDate">
    </div>
  </div>
</div>
