<div class="form-section" [formGroup]="formGroup">
  <h2>{{ 'PERSONNEL.FAMILY.TITLE' | translate }}</h2>
  <div class="form-row">
    <div class="form-group">
      <label for="motherName">{{ 'PERSONNEL.FAMILY.MOTHER_NAME' | translate }} <span class="required">*</span></label>
      <input type="text" id="motherName" formControlName="motherName">
      <div class="error-message" *ngIf="formGroup.get('motherName')?.invalid &&
                  formGroup.get('motherName')?.touched">
        {{ 'ERRORS.MOTHER_NAME_REQUIRED' | translate }}
      </div>
    </div>
    <div class="form-group">
      <label for="fatherName">{{ 'PERSONNEL.FAMILY.FATHER_NAME' | translate }}</label>
      <input type="text" id="fatherName" formControlName="fatherName">
    </div>
  </div>
  <div class="form-row">
    <div class="form-group">
      <label for="nationality">{{ 'PERSONNEL.FAMILY.NATIONALITY' | translate }}</label>
      <input type="text" id="nationality" formControlName="nationality">
    </div>
    <div class="form-group">
      <label for="birthplace">{{ 'PERSONNEL.FAMILY.BIRTHPLACE' | translate }}</label>
      <input type="text" id="birthplace" formControlName="birthplace">
    </div>
    <div class="form-group">
      <label for="birthplaceState">{{ 'PERSONNEL.FAMILY.STATE' | translate }}</label>
      <select id="birthplaceState" formControlName="birthplaceState">
        <option value="">{{ 'COMMON.SELECT' | translate }}</option>
        <ng-container *ngFor="let state of states">
          <option [value]="state">{{ state }}</option>
        </ng-container>
      </select>
    </div>
  </div>
</div>
